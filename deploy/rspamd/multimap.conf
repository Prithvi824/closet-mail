# The built-in GTUBE matcher does not fire for HTTP-submitted mail in this version, so the
# standard test string is matched explicitly; it makes quarantine/discard testable end to end.
CLOSET_GTUBE {
  type = "content";
  filter = "body";
  regexp = true;
  map = "${LOCAL_CONFDIR}/local.d/gtube.map";
  score = 10.0;
  description = "GTUBE test string";
}
