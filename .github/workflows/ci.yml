# Tests, lint and type checks on every push and pull request; on pushes to main, also build and
# publish the production images to GHCR (tagged with the commit SHA and "latest").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # Same host ports as deploy/docker-compose.dev.yml, which tests/conftest.py expects.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mailalias
          POSTGRES_USER: mailalias
          POSTGRES_PASSWORD: mailalias
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mailalias -d mailalias"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy mailalias
      - run: uv run pytest -q

  edge:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  landing:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Publish to Cloudflare Pages on pushes to main, once the CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID repository secrets exist (token needs Account > Cloudflare Pages > Edit).
      - name: Check for Pages credentials
        id: pages
        run: echo "enabled=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pages.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, edge, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, web, rspamd]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ghcr.io/prithvi824/closet-mail-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/prithvi824/closet-mail-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
