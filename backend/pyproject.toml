[project]
name = "mailalias"
version = "0.1.0"
description = "Internal email alias forwarding service for closetcompute.online"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.111",
    "celery>=5",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "python-gnupg>=0.5.7",
    "python-multipart>=0.0.32",
    "redis>=5",
    "selectolax>=1.0.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "svix>=2.8.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[project.scripts]
mailalias = "mailalias.cli:app"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mailalias"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "gnupg.*", "celery.*", "svix.*", "selectolax.*", "webauthn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.111",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[[tool.mypy.overrides]]
# Celery ships no type information; its task decorator is untyped.
module = ["mailalias.tasks.*"]
disable_error_code = ["untyped-decorator"]
